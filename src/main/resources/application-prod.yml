spring:
  datasource:
    url: jdbc:mysql://mysql:3306/traveljournal_db
    username: app_user
    password: ${secret.prod-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

oauth:
  kakao:
    redirect-uri: ${oauth.kakao.prod-redirect-uri}

springdoc:
  request-url: ${secret.prod-request-url}