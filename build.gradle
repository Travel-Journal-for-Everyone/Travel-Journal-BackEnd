plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2' // Asciidoctor 플러그인 추가
}

ext {
    snippetsDir = file('build/generated-snippets') // REST Docs snippets 파일 경로
}

group = 'com.traveljournal'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    asciidoctorExt
}

repositories {
    mavenCentral()
    google()  // Google Maven Repository 추가
    maven { url = uri('https://jitpack.io') } // JitPack 저장소 추가
}

dependencies {
    // Spring Boot 및 기타 필요한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.2.0'

    // Commons IO - openfeign 취약점 해결
    implementation 'commons-io:commons-io:2.14.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 데이터베이스 및 JPA
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Cloud AWS https://mvnrepository.com/artifact/io.awspring.cloud/spring-cloud-aws-starter
    implementation group: 'io.awspring.cloud', name: 'spring-cloud-aws-starter', version: '3.3.0'

    // Spring REST Docs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Hibernate Validator
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // JWKSET 관련  ( 구글 )
    implementation 'com.nimbusds:nimbus-jose-jwt:9.1.2'  // 최신 버전으로 변경
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.20.0'
    implementation 'com.google.http-client:google-http-client-gson:1.41.0'
    implementation 'com.google.api-client:google-api-client:1.34.0'  // Google API 클라이언트

    // AWS SDK V2 BOM
    implementation platform('software.amazon.awssdk:bom:2.31.3')

    // AWS SDK V2 S3 클라이언트
    implementation 'software.amazon.awssdk:s3'

    // AWS CRT HTTP 클라이언트 - 성능 최적화를 위해 필요
    implementation 'software.amazon.awssdk:aws-crt-client'

    // 이미지 리사이징을 위한 Thumbnailator
    implementation 'net.coobird:thumbnailator:0.4.20'
}

test {
    useJUnitPlatform() // JUnit 5 사용
    outputs.dir snippetsDir // REST Docs snippets 디렉터리 생성
}

asciidoctor {
    inputs.dir snippetsDir // snippets 디렉토리 경로 연결
    configurations 'asciidoctorExt'
    dependsOn test // Tests 실행 후 Asciidoctor 빌드
}
